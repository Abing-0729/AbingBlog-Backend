# 网关编排：单独一个 nginx 容器做统一入口。
# 前后端各自的 compose 不受影响，本网关只负责把外部流量分发到它们。
# 用法（服务器上）：docker compose up -d
services:
  gateway:
    image: ghcr.io/abing-0729/abingblog-backend-nginx:1.27-alpine
    restart: unless-stopped
    # host 网络：容器直接共享宿主机网络栈，才能访问前后端容器绑定的
    # 127.0.0.1:8080 / 127.0.0.1:8081。注意这是 Linux 专属特性，
    # host 模式下 ports 映射被忽略，nginx listen 80 即宿主机 80。
    network_mode: "host"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
