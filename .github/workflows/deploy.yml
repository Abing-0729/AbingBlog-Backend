name: Deploy

on:
  workflow_dispatch:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Compute lowercase image name
        id: image
        run: echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.image }}:${{ github.sha }}
            ${{ steps.image.outputs.image }}:latest

      # 把 mysql/redis 基础镜像中转进 GHCR，让生产服务器只访问 ghcr.io，绕开国内连不上 Docker Hub 的问题
      - name: Mirror mysql/redis images to GHCR
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          docker pull mysql:8.0
          docker pull redis:7-alpine
          docker pull nginx:1.27-alpine
          docker tag mysql:8.0 "$IMAGE-mysql:8.0"
          docker tag redis:7-alpine "$IMAGE-redis:7-alpine"
          docker tag nginx:1.27-alpine "$IMAGE-nginx:1.27-alpine"
          docker push "$IMAGE-mysql:8.0"
          docker push "$IMAGE-redis:7-alpine"
          docker push "$IMAGE-nginx:1.27-alpine"

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      # 把最新 docker-compose.prod.yml 同步到服务器，避免服务器残留旧版编排文件（旧版 mysql/redis 仍指向 Docker Hub）
      - name: Sync compose file to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: docker-compose.prod.yml
          target: ${{ secrets.DEPLOY_PATH }}

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        env:
          IMAGE: ${{ needs.publish.outputs.image }}:${{ github.sha }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 30m   # 默认 10m；mysql:8.0 镜像约 230MB，国内到 ghcr.io 慢，首拉需更久
          envs: IMAGE,DEPLOY_PATH,GHCR_USERNAME,GHCR_TOKEN,MYSQL_ROOT_PASSWORD,JWT_SECRET
          script: |
            set -eu
            cd "$DEPLOY_PATH"
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
            export IMAGE MYSQL_ROOT_PASSWORD JWT_SECRET
            export IMAGE_BASE="${IMAGE%:*}"   # 去掉 :sha，得到 ghcr.io/<owner>/<repo>，拼出 mysql/redis 镜像名
            docker compose -f docker-compose.prod.yml pull server
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f

            # 等 server 真正就绪：HTTP 服务是启动流程的最后一步（连 Redis→建库→迁移→seed 之后才 Listen），
            # 首启要几十秒，直接 curl 会撞上「Empty reply」。这里循环探测，任一失败都继续等，最多约 150s。
            for i in $(seq 1 30); do
              if curl --fail --silent --max-time 5 "http://127.0.0.1:${SERVER_PORT:-8080}/api/v1/healthz" >/dev/null 2>&1; then
                echo "healthz OK"
                exit 0
              fi
              echo "server not ready yet ($i/30), retrying in 5s"
              sleep 5
            done

            # 等不到就打印容器状态和日志，方便定位
            docker compose -f docker-compose.prod.yml ps
            docker compose -f docker-compose.prod.yml logs --no-color --tail=200 server
            exit 1