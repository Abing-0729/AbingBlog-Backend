# 服务配置（开发环境）。后续 Docker 部署时用环境变量覆盖这些值
server:
  port: 8080

mysql:
  host: 127.0.0.1
  port: 3307        # docker-compose 里 mysql 映射的宿主端口（本机 3306 是本地 MySQL）
  user: root
  password: blog123456   # 与 docker-compose.yml 的 MYSQL_ROOT_PASSWORD 一致（仅本地开发）
  dbname: blog      # 数据库不存在会自动创建
  charset: utf8mb4
jwt:
  secret: "123" # 后续通过环境变量进行覆盖
  expire_hours: 24

# 跨域白名单：允许访问后端的前端来源。Vue dev server 默认 5173，Vite 预览 4173
# 生产环境改成真实前端域名，用环境变量覆盖
cors:
  allow_origins:
    - "http://localhost:5173"
    - "http://127.0.0.1:5173"

# Redis 缓存连接。docker-compose 里 redis 映射宿主 6379
# 生产环境用环境变量覆盖 host/password
redis:
  host: 127.0.0.1
  port: 6379
  password: ""
  db: 0

# 初始管理员账号：首次启动时若该用户不存在则自动创建（密码会 bcrypt 后入库）
# 生产环境用环境变量覆盖，切勿沿用下面的默认值
admin:
  username: "admin"
  password: "admin123456"
